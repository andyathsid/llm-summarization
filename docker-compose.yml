services:
  pgvector:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: langchain
      POSTGRES_USER: langchain
      POSTGRES_PASSWORD: langchain
    ports:
      - "${PGVECTOR_PORT:-6024}:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langchain -d langchain"]
      interval: 5s
      timeout: 5s
      retries: 12
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.17.2
    ports:
      - "127.0.0.1:5000:5000"
    command:
      - mlflow
      - server
      - --host
      - "0.0.0.0"
      - --port
      - "5000"
      - --backend-store-uri
      - sqlite:////mlflow-data/mlflow.db
      - --artifacts-destination
      - /mlflow-data/artifacts
    volumes:
      - mlflow_data:/mlflow-data

volumes:
  pgvector_data:
  mlflow_data:
